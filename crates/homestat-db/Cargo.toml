[package]
name = "homestat-db"
version = "0.1.0"
edition = "2024"


[dependencies]
homestat-wire = { path = "../homestat-wire" }
sqlx = { version = "0.8.6", default-features = false, features = [
    "macros",
    "migrate",
    "sqlite-unbundled",
    "runtime-tokio",
    "chrono",
] }
tokio = { version = "1.48.0", features = ["full"] }
thiserror = { version = "2.0.17" }
chrono = "0.4.42"
serde_json = { version = "1.0.145" }

[dev-dependencies]
rand = { version = "0.9.2" }
tracing = "0.1.41"
tempfile = "3.23.0"
anyhow = "1.0.100"
