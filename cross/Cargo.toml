cargo-features = ["per-package-target"]

# not actually a workspace
[workspace]

[package]
name = "homestat-rp"
version = "0.1.0"
edition = "2024"
# currently bugged, use --target=thumbv6m-none-eabi on cli instead
# https://github.com/rust-lang/cargo/issues/14291
# default-target = "thumbv6m-none-eabi"
# forced-target = "thumbv6m-none-eabi"

[[bin]]
name = "homestat-rp"
test = false
doctest = false
bench = false

[dependencies]
# workspace libs
homestat-wire = { path = "../crates/homestat-wire" }

# embassy
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.8.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-usb = { version = "0.5.1", features = ["defmt"] }
embassy-usb-logger = { version = "0.5.1" }
embassy-net = { version = "0.7.1", features = [
    "defmt",
    "tcp",
    "udp",
    "raw",
    "dhcpv4",
    "medium-ethernet",
    "dns",
    "proto-ipv4",
    "proto-ipv6",
    "multicast",
] }
embassy-net-wiznet = { version = "0.2.1", features = ["defmt"] }
embedded-nal-async = "0.8.0"
embedded-io-async = { version = "0.6.1", features = ["defmt-03"] }
embassy-futures = { version = "0.1.2" }
assign-resources = "0.5.0"

# cyw43 firmware for rp
cyw43 = { version = "0.5.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.8.0", features = ["defmt"] }
pio-proc = "0.3.0"
pio = "0.3.0"

# cortex-m specifics
cortex-m-rt = "0.7.5"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# std replacements
static_cell = "2.1.1"
portable-atomic = { version = "1.11.1", features = ["critical-section"] }
heapless = "0.9.1"
defmt-rtt = "1.0.0"

# normal libs
log = "0.4.28"
reqwless = { version = "0.13.0", features = ["defmt"] }
serde = { version = "1.0.225", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3" }
chrono = { version = "0.4.42", default-features = false }
rand = { version = "0.9.2", default-features = false, features = ["std_rng"] }
thiserror = { version = "2.0.17", default-features = false }
getrandom = { version = "0.3.4" }
blake2 = { version = "0.10.6", default-features = false }
